version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: ma-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: multi-agent-platform
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ma-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ma-backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/multi-agent-platform
      VECTOR_DB_PROVIDER: qdrant
      QDRANT_HOST: qdrant
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - qdrant
    restart: unless-stopped

volumes:
  mongodb_data:
  qdrant_data:
