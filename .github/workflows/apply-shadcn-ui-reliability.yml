name: Apply shadcn UI reliability patch

on:
  push:
    branches:
      - fix/shadcn-ui-reliability-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply UI patch
        run: |
          python .github/scripts/apply_shadcn_ui_reliability.py
          sed -i "/import { Button } from '@\\/components\\/ui\\/button'/d" frontend/src/components/sidebar.tsx

      - name: Check whitespace
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: |
          export NEXTAUTH_SECRET="$(openssl rand -hex 32)"
          export NEXTAUTH_URL="http://localhost:3000"
          npm run build

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'frontend/src/components/sidebar.tsx' \
            'frontend/src/components/top-bar.tsx' \
            'frontend/src/components/image-preview-card.tsx'
          git commit -m "fix: improve shared UI with shadcn patterns" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
