name: Apply chat stream runtime recovery

on:
  push:
    branches:
      - fix/chat-stream-runtime-recovery-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply recovery patch
        run: python .github/scripts/apply_chat_stream_runtime_recovery.py

      - name: Check whitespace and Python syntax
        run: |
          git diff --check
          python -m py_compile backend/src/api/routes/chat.py backend/tests/test_chat_stream_runtime_recovery.py

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run targeted backend recovery tests
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-testing-only
          GEMINI_API_KEY: mock-gemini-key
          MONGODB_URI: mongodb://localhost:27017/ci_test_db
          LLM_PROVIDER: groq
        run: pytest -q tests/test_chat_stream_runtime_recovery.py tests/test_chat_quality_runtime.py tests/test_adk_grounded_tools_reliability.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

      - name: Frontend production build
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: ci-only-nextauth-secret-0123456789abcdef0123456789abcdef
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'backend/src/api/routes/chat.py' \
            'backend/tests/test_chat_stream_runtime_recovery.py' \
            'frontend/src/app/(dashboard)/chat/page.tsx' \
            'frontend/tests/chat-stream-runtime-recovery.test.ts'
          git commit -m "fix: recover chat stream failures before generic retry" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
