name: Apply grounding reliability repair

on:
  push:
    branches:
      - fix/grounding-reliability-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply grounding repair
        run: python .github/scripts/apply_grounding_reliability.py
      - name: Check syntax and whitespace
        run: |
          python -m py_compile backend/src/adk/tools.py backend/src/api/routes/_chat_quality.py backend/tests/test_grounding_search_reliability.py
          git diff --check
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run focused grounding tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB: multi_agent_test
        run: pytest -q tests/test_grounding_search_reliability.py tests/test_entity_alias_grounding.py tests/test_chat_quality_runtime.py
      - name: Run full backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB: multi_agent_test
        run: pytest -q
      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/adk/tools.py backend/src/api/routes/_chat_quality.py backend/tests/test_grounding_search_reliability.py
          git commit -m "fix: harden live grounding search reliability"
          git push
