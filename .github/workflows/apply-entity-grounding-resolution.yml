name: Apply entity grounding resolution

on:
  push:
    branches:
      - fix/entity-grounding-resolution-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply entity grounding repair
        run: python .github/scripts/apply_entity_grounding_resolution.py
      - name: Check syntax and whitespace
        run: |
          python -m py_compile backend/src/adk/tools.py backend/src/api/routes/_chat_quality.py backend/tests/test_entity_grounding_resolution.py
          git diff --check
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run focused grounding tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB: multi_agent_test
        run: pytest -q tests/test_entity_grounding_resolution.py tests/test_grounding_search_reliability.py tests/test_entity_alias_grounding.py tests/test_chat_quality_runtime.py
      - name: Live PCCE Goa search smoke
        working-directory: backend
        env:
          SECRET_KEY: github-actions-live-search-validation-key-20260923
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio
          from src.adk.tools import web_search

          async def main():
              output = await web_search('"PCCE" Goa official site', for_research=True, max_items=8)
              print(output[:8000])
              lower = output.lower()
              assert 'http' in lower, 'No source URL returned'
              assert 'pcce' in lower, 'PCCE not present in live search evidence'
              assert 'goa' in lower, 'Goa not present in live search evidence'

          asyncio.run(main())
          PY
      - name: Run full backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB: multi_agent_test
        run: pytest -q
      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/adk/tools.py backend/src/api/routes/_chat_quality.py backend/tests/test_entity_grounding_resolution.py
          git commit -m "fix: resolve acronym entities with reliable web grounding"
          git push
