name: Apply entity alias grounding repair

on:
  push:
    branches:
      - fix/entity-alias-grounding-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply grounding repair
        run: python .github/scripts/apply_entity_alias_grounding.py

      - name: Check whitespace and syntax
        run: |
          git diff --check
          python -m py_compile backend/src/api/routes/_chat_quality.py backend/tests/test_entity_alias_grounding.py

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run targeted grounding tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentic_test
          SECRET_KEY: test-secret-key-for-ci-only
        run: pytest -q tests/test_entity_alias_grounding.py tests/test_adk_evidence_gap.py tests/test_chat_quality_runtime.py

      - name: Run full backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentic_test
          SECRET_KEY: test-secret-key-for-ci-only
        run: pytest -q

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/api/routes/_chat_quality.py backend/tests/test_entity_alias_grounding.py
          git commit -m "fix: resolve acronym aliases during grounded search" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
