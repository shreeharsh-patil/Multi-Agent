name: Apply chat quality repair

on:
  push:
    branches:
      - fix/chat-quality-optimization-20260922

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply targeted quality fixes
        run: |
          python .github/scripts/apply_chat_quality_patch.py
          python .github/scripts/apply_memory_quality_patch.py
          python .github/scripts/apply_adk_session_quality_patch.py

      - name: Validate Python syntax and patch cleanliness
        run: |
          python -m compileall -q backend/src backend/tests
          git diff --check

      - name: Commit repaired files
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/api/routes/chat.py backend/src/adk/runner.py backend/src/adk/agents.py backend/src/services/memory/service.py
          git commit -m "fix: deduplicate ADK conversation context"
          git push origin HEAD:${GITHUB_REF_NAME}
