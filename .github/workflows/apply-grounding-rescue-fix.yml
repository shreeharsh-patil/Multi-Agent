name: Apply grounding rescue fix

on:
  push:
    branches:
      - fix/grounding-rescue-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Repair temporary patch script quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_grounding_rescue_fix.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace("test_path.write_text(r'''", 'test_path.write_text(r"""', 1)
          marker = "''', encoding=\"utf-8\")\nprint(\"wrote backend/tests/test_grounding_recovery.py\")"
          replacement = '""", encoding="utf-8")\nprint("wrote backend/tests/test_grounding_recovery.py")'
          if marker not in text:
              raise SystemExit('closing test delimiter marker not found')
          text = text.replace(marker, replacement, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply grounding recovery patch
        run: python .github/scripts/apply_grounding_rescue_fix.py

      - name: Normalize generated URL extraction regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/adk/runner.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          changed = False
          for i, line in enumerate(lines):
              if 'for url in re.findall(' in line and i > 0 and 'continue' in lines[i - 1]:
                  lines[i] = '        for url in re.findall(r"https?://[^\\s)<>]+", line, re.I):'
                  changed = True
                  break
          if not changed:
              raise SystemExit('generated URL extraction line not found')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Check syntax and whitespace
        run: |
          python -m py_compile backend/src/adk/runner.py backend/src/api/routes/_chat_quality.py backend/tests/test_grounding_recovery.py
          git diff --check

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run grounding and chat quality regression tests
        working-directory: backend
        env:
          SECRET_KEY: "ci-secret-key-testing-only"
          GEMINI_API_KEY: "mock-gemini-key"
          LLM_PROVIDER: "groq"
        run: |
          pytest -q \
            tests/test_grounding_recovery.py \
            tests/test_chat_quality_runtime.py \
            tests/test_adk_grounded_tools_reliability.py \
            tests/test_adk_reliability_routing.py \
            tests/test_adk_runner.py

      - name: Commit tested source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'backend/src/adk/runner.py' \
            'backend/src/api/routes/_chat_quality.py' \
            'backend/tests/test_grounding_recovery.py'
          git commit -m "fix: recover grounded answers before failing closed" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
