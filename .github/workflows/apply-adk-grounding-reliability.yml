name: Apply ADK grounding reliability

on:
  push:
    branches:
      - fix/adk-grounded-tools-reliability-20260923

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate patch script
        run: python -m py_compile .github/scripts/apply_adk_grounding_reliability.py

      - name: Apply reliability patch
        run: python .github/scripts/apply_adk_grounding_reliability.py

      - name: Validate source syntax and whitespace
        run: |
          python -m py_compile \
            backend/src/adk/agents.py \
            backend/src/orchestrator/router.py \
            backend/src/orchestrator/dynamic.py \
            backend/src/api/routes/_chat_quality.py \
            backend/tests/test_adk_grounded_tools_reliability.py
          git diff --check

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q -r requirements.txt

      - name: Run focused reliability tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_adk_grounded_tools_reliability.py \
            tests/test_adk_reliability_routing.py \
            tests/test_google_search_division.py \
            tests/test_chat_quality_runtime.py

      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/adk/agents.py \
            backend/src/orchestrator/router.py \
            backend/src/orchestrator/dynamic.py \
            backend/src/api/routes/_chat_quality.py
          git commit -m "fix: ground external facts through ADK search" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
