name: Agentic Platform CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend Linting & Pytest
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: "ci-secret-key-testing-only"
          GEMINI_API_KEY: "mock-gemini-key"
          MONGODB_URI: "mongodb://localhost:27017/ci_test_db"
          LLM_PROVIDER: "groq"
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: "ci-only-nextauth-secret-0123456789abcdef0123456789abcdef"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund

      - name: Typecheck Frontend
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test

      - name: Next.js Production Build
        run: |
          cd frontend
          npm run build
