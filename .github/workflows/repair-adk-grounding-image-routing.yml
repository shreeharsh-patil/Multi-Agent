name: Repair ADK grounding and image routing

on:
  push:
    branches:
      - fix/adk-grounding-image-routing-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate patcher
        run: python -m py_compile .github/scripts/repair_adk_grounding_image_routing.py

      - name: Apply repair
        run: python .github/scripts/repair_adk_grounding_image_routing.py

      - name: Validate changed Python
        run: |
          python -m py_compile \
            backend/src/orchestrator/router.py \
            backend/src/api/routes/chat.py \
            backend/src/api/routes/_chat_quality.py \
            backend/tests/test_chat_quality_runtime.py \
            backend/tests/test_adk_reliability_routing.py
          git diff --check

      - name: Run focused tests
        working-directory: backend
        run: |
          python -m pip install -q -r requirements.txt
          pytest -q \
            tests/test_chat_quality_runtime.py \
            tests/test_fast_stream_routing.py \
            tests/test_adk_reliability_routing.py \
            tests/test_adk_runner.py \
            tests/test_internet_intelligence_system.py

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/orchestrator/router.py \
            backend/src/api/routes/chat.py \
            backend/src/api/routes/_chat_quality.py \
            backend/tests/test_chat_quality_runtime.py \
            backend/tests/test_adk_reliability_routing.py
          git commit -m "fix: make ADK grounding and image routing reliable" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
