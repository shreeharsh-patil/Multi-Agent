name: Apply chat streaming repair

on:
  push:
    branches:
      - fix/chatgpt-style-streaming-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate repair script
        run: python -m py_compile .github/scripts/apply_streaming_repair_v3.py

      - name: Apply streaming repair
        run: python .github/scripts/apply_streaming_repair_v3.py

      - name: Validate changed Python
        run: |
          python -m py_compile \
            backend/src/api/routes/chat.py \
            backend/src/api/routes/_chat_quality.py \
            backend/tests/test_chat_quality_runtime.py
          git diff --check

      - name: Run focused streaming tests
        working-directory: backend
        run: |
          python -m pip install -q -r requirements.txt
          pytest -q tests/test_chat_quality_runtime.py

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/api/routes/chat.py \
            backend/src/api/routes/_chat_quality.py \
            backend/tests/test_chat_quality_runtime.py
          git commit -m "fix: stream chat responses progressively" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
