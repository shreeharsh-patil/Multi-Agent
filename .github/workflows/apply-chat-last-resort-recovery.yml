name: Apply chat last-resort recovery

on:
  push:
    branches:
      - fix/chat-last-resort-recovery-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multi_agent
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply recovery patch
        run: python .github/scripts/apply_chat_last_resort_recovery.py
      - name: Check syntax and whitespace
        run: |
          python -m py_compile backend/src/api/routes/chat.py backend/tests/test_chat_last_resort_recovery.py
          git diff --check
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run focused recovery tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/multi_agent
          MONGODB_URL: mongodb://localhost:27017
          JWT_SECRET: test-secret
        run: pytest -q tests/test_chat_last_resort_recovery.py tests/test_chat_quality_runtime.py tests/test_entity_alias_grounding.py
      - name: Run full backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/multi_agent
          MONGODB_URL: mongodb://localhost:27017
          JWT_SECRET: test-secret
        run: pytest -q
      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/api/routes/chat.py backend/tests/test_chat_last_resort_recovery.py
          git commit -m "fix: recover chat after ADK stream failures" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
