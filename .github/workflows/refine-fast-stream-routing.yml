name: Refine fast stream routing

on:
  push:
    branches:
      - fix/chatgpt-style-streaming-20260923

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply routing refinement
        run: python .github/scripts/refine_fast_stream_routing.py
      - name: Validate syntax and whitespace
        run: |
          python -m py_compile backend/src/api/routes/chat.py backend/tests/test_fast_stream_routing.py
          git diff --check
      - name: Run focused routing and stream tests
        working-directory: backend
        run: |
          python -m pip install -q -r requirements.txt
          pytest -q tests/test_fast_stream_routing.py tests/test_chat_quality_runtime.py
      - name: Commit routing refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/api/routes/chat.py
          git commit -m "fix: keep ordinary search concepts on fast chat path" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
