name: Apply mobile chat overflow fix

on:
  push:
    branches:
      - fix/mobile-chat-overflow-20260923

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply responsive overflow patch
        run: python .github/scripts/apply_mobile_chat_overflow_fix.py

      - name: Check whitespace
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/app/(dashboard)/chat/page.tsx \
            frontend/src/components/ui/scroll-area.tsx \
            frontend/src/components/markdown-renderer.tsx \
            frontend/src/components/image-preview-card.tsx \
            frontend/src/app/shared/chat/[token]/page.tsx
          git commit -m "fix: keep mobile chat content inside viewport" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
